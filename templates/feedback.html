{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-lg-7">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-warning bg-opacity-10 text-warning d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                    <i class="fa-solid fa-lightbulb fs-2"></i>
                </div>
                <h3 class="fw-bold">Təklif və İradlarınız</h3>
                <p class="text-muted small">Platformamızı inkişaf etdirmək üçün rəyləriniz bizim üçün çox dəyərlidir.</p>
            </div>

            <form action="{{ url_for('feedback') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">Ad və Soyadınız</label>
                    <input type="text" name="name" class="form-control rounded-3 border-light bg-light py-2" placeholder="Məs: Əli Əliyev" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small text-muted">E-poçt Ünvanı</label>
                    <input type="email" name="email" class="form-control rounded-3 border-light bg-light py-2" placeholder="name@example.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small text-muted">Təklif və ya Mesajınız</label>
                    <textarea name="message" class="form-control rounded-3 border-light bg-light" rows="5" placeholder="Saytda görmək istədiyiniz yeni funksiyalar və ya qarşılaşdığınız çətinliklər..." required></textarea>
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2.5 rounded-3 fw-bold shadow-sm">
                    <i class="fa-solid fa-paper-plane me-2"></i> Mesajı Göndər
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

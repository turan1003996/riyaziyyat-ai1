{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="custom-card p-4 p-md-5 shadow-lg">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-right-to-bracket fs-3"></i>
                </div>
                <h3 class="fw-bold">Hesaba Giriş</h3>
                <p class="text-secondary small">MathOlympiad icmasına xoş gəldiniz!</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <!-- İstifadəçi Adı və ya Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">İstifadəçi Adı və ya Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="İstifadəçi adı və ya e-poçt" required>
                    </div>
                </div>

                <!-- Şifrə və Şifrəni Unutdum Linki -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold mb-0">Şifrə</label>
                        <a href="{{ url_for('forgot_password') }}" class="small text-primary text-decoration-none fw-semibold">Şifrəni unutdunuz?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="Şifrənizi daxil edin" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-warning w-100 py-2.5 rounded-3 mb-3">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Daxil Ol
                </button>
            </form>

            <div class="text-center border-top pt-3">
                <p class="small text-muted mb-0">Hesabınız yoxdur? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Qeydiyyatdan keçin</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="custom-card p-4 p-md-5 shadow-lg">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-warning bg-opacity-10 text-warning d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-key fs-3"></i>
                </div>
                <h3 class="fw-bold">Şifrənin Bərpası</h3>
                <p class="text-secondary small">Hesabınıza bağlı e-poçt ünvanını daxil edin.</p>
            </div>

            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label fw-semibold">E-poçt Ünvanı</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control border-start-0 bg-light" placeholder="name@example.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-primary w-100 py-2.5 rounded-3 mb-3">
                    <i class="fa-solid fa-paper-plane me-2"></i> Bərpa Linkini Göndər
                </button>
            </form>

            <div class="text-center border-top pt-3">
                <p class="small text-muted mb-0"><a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Giriş səhifəsinə qayıt</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
